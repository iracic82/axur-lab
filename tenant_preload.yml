# Per-tenant preload for the Axur Instruqt lab — executed by preload_tenant.py from the
# challenge-2 setup script for EVERY sandbox tenant. Idempotent: safe to re-run.
#
# Placeholders usable in any string: {key} = tenant key (e.g. OSMR), {name} = tenant name (sandbox id).
# All sections are optional. Everything below is EMPTY on purpose until Axur tells us what to preload.
#
# >>> Full catalogue of ready-to-use examples (every asset type, safelist, automation, ticket, EASM seed):
# >>>     examples/tenant_preload.example.yml
# >>> Copy entries from there into the sections below, then test with
# >>>     python3 preload_tenant.py --key PRLD --dry-run

