# Per-tenant preload for the Axur Instruqt lab — executed by preload_tenant.py from the
# challenge-2 setup script for EVERY sandbox tenant. Idempotent: safe to re-run.
#
# Placeholders usable in any string: {key} = tenant key (e.g. OSMR), {name} = tenant name (sandbox id).
# All sections are optional. Everything below is EMPTY on purpose until Axur tells us what to preload;
# uncomment / fill in the examples as needed.

# ---- Credit limit: unlimited | number | by-product map ----------------------------------------------
# credit_limit: unlimited
# credit_limit: 500
# credit_limit:
#   BRAND_PROTECTION: 200
#   DATA_LEAKAGE: 100
#   TAKEDOWN: 10          # products not listed default to UNLIMITED

# ---- Assets: POST /assets-api/customers/{key}/asset (types: BRAND, DOMAIN, VIP, THIRD_PARTY_PAGE, APP,
#      TRACKING_TOKEN, BIN, IP). Matched on type+name, so existing ones are skipped. --------------------
assets: []
# assets:
