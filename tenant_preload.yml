#     monitoring: [phishing, malware, fake-social-media-profile, similar-domain-name]
#     properties:
#       officialWebsite: https://www.infoblox.com
#       brandSize: enterprise
#       nameVariations: ["infoblox"]
#       primaryLocale: ["US:en"]
#   - type: DOMAIN
#     name: infoblox.com
#     monitoring: ["credentials:employee", "credentials:user", "code-secret-leak", "mentions"]

# ---- Safelist: POST /touchpoints/items (group: self | partner | email | other) ----------------------
safelist: []
# safelist:
