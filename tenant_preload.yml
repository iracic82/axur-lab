# Per-tenant preload for the Axur Instruqt lab — executed by preload_tenant.py from the
# challenge-1 setup script for EVERY sandbox tenant. Idempotent: safe to re-run.
#
# Content below = Axur's recommendation for the Infoblox Exchange lab (received 2026-09-11):
#   Brand  Netflix   — phishing + similar-domain-name
#   Domain example.com — user/employee credentials + code secret leak
#   Vendor Microsoft  — supply-chain-intel
# Payloads exactly as provided by Axur (POST /assets-api/customers/{customerKey}/asset).
# Placeholders usable in any string: {key} = tenant key, {name} = tenant name (sandbox id).
# More examples of every kind: examples/tenant_preload.example.yml

# ---- Credit limit: unlimited | number | by-product map (unset = leave as created) --------------------
# credit_limit: unlimited

# ---- Assets: matched on type+name, existing ones are skipped -----------------------------------------
assets:
  # Named exactly as in Axur's demo tenant so the guide's screenshots match what participants see.
  - type: BRAND
    name: "Demo Netflix, Inc"
    monitoring: [phishing, similar-domain-name, fake-social-media-profile, fraudulent-brand-use]
    properties:
      officialWebsite: https://netflix.com
      nameVariations: [Netflix]
      primaryLocale: ["US:en"]

  - type: DOMAIN
    name: example.com
    monitoring: ["credentials:user", "credentials:employee", "code-secret-leak"]

  - type: CUSTOMER_VENDOR
    name: Microsoft
    monitoring: [supply-chain-intel]
    properties:
      vendorId: 30            # required; Axur vendor-catalogue id, name must match (see examples/axur_vendor_ids.json)

  # Fictional executive for the Executives & VIPs chapter. "executives" is the only monitoring id VIP accepts;
  # name variations and the face photo are UI-only, so this asset shows the workspace configured, not findings.
  - type: VIP
    name: Alex Rivera
    monitoring: [executives]

# ---- Safelist: POST /touchpoints/items (group: self | partner | email | other) ----------------------
safelist: []

# ---- Raw requests: automations, tickets, EASM seeds, ... ({key}/{name} substituted) -----------------
# Tested live 2026-09-11. Real detections arrive on their own (hundreds of Brand Protection tickets and
# thousands of credential exposures within minutes), so only what the collectors cannot provide is seeded.
# ---- EASM seeds: starting points for attack-surface discovery (skipped when already registered) --------
easm_seeds: ["example.com"]

requests:
  # One curated sample ticket: the "Netflix Golden" fake profile the Lab Guide walks through. Real detections
  # are phishing pages and lookalike domains, so without this the fake-profile chapter would have no example.
  # Assets are string asset keys; "{asset:<name>}" is resolved from the tenant after the assets step, so the key
  # never has to be guessed. A repeated reference answers 409, so re-runs are safe. Participants are told not to
  # request takedowns on it.
  - method: POST
    path: /api/tickets-api/tickets
    json: {reference: "https://www.facebook.com/netflix.golden.lab.sample", customer: "{key}", type: fake-social-media-profile, assets: ["{asset:Demo Netflix, Inc}"]}
    ok: [200, 409]
# Kept for reference (off): a curated phishing ticket. Not needed, the collectors deliver hundreds.
#   - method: POST
#     path: /api/tickets-api/tickets
#     json: {reference: "https://netflix-billing-update.example.net/login", customer: "{key}", type: phishing, assets: ["{asset:Demo Netflix, Inc}"]}
#     ok: [200, 409]
